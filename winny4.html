<!DOCTYPE html>
<html lang=“en”>
<head>
    <meta charset=“UTF-8”>
    <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
    <title>Happy Birthday</title>
    <style>
        /* စာမျက်နှာ နောက်ခံနဲ့ စာသားတွေကို အလယ်ပို့ဖို့ CSS */
        body {
            background-color: #fff0f5; /* ပန်းရောင်ဖျော့ဖျော့ နောက်ခံ */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Happy Birthday စာသား ဒီဇိုင်း */
        h1 {
            color: #d63384;
            font-size: 3rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /* Video ဘောင် ဒီဇိုင်း */
        video {
            width: 100%;
            max-width: 720px; /* Video အကျယ်ဆုံး 720px ထိပဲ ကြီးမယ် */
            border-radius: 15px; /* ထောင့်လေးတွေ ဝိုင်းသွားအောင် */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); /* အရိပ်လေး ထည့်ထားတာ */
        }
    </style>
</head>
<body>

    <!— အပေါ်ဆုံးက Happy Birthday စာသား —>
    <h1>🎉 Happy Birthday! 🎂</h1>

    <!— အောက်မှာ ပေါ်မယ့် Video —>
    <video controls width="400" height="500">
    <source src="AUNGlay.mp4" type="video/mp4">
    သင့် Browser က Video ကို မထောက်ပံ့ပါ။
</video>

</body>
</html>
